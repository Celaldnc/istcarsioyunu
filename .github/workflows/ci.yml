name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint - Typecheck - Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bagimliliklari kur (lockfile birebir)
        run: npm ci

      - name: Lint (0 warning tolerans)
        run: npm run lint

      - name: Bicimlendirme kontrolu
        run: npm run format:check

      - name: Tip kontrolu
        run: npm run typecheck

      - name: Testler + coverage esikleri
        run: npm run test:ci

      - name: Expo saglik kontrolu
        run: npm run doctor
