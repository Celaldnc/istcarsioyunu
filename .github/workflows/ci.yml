name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint - Typecheck - Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Bagimliliklari kur (lockfile birebir)
        run: npm ci

      - name: Lint (0 warning tolerans)
        run: npm run lint

      - name: Tip kontrolu
        run: npm run typecheck

      - name: Testler + coverage esikleri
        run: npm run test:ci

      - name: Expo saglik kontrolu
        run: npm run doctor
